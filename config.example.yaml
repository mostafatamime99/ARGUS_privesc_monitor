# ARGUS example configuration
# Copy this file to config.yaml and fill in real values.
# NEVER commit config.yaml — it contains secrets.

daemon:
  scan_interval_seconds: 60
  db_path: privesc_monitor.db
  # Stamped on every alert and Telegram message. Empty uses the machine hostname.
  hostname: ""
  # Re-check the SQLite hash chain while the daemon is running. 0 disables.
  integrity_check_seconds: 300

telegram:
  enabled: false
  # Obtain from @BotFather on Telegram
  bot_token: "YOUR_BOT_TOKEN_HERE"
  # Run: curl "https://api.telegram.org/bot<TOKEN>/getUpdates"
  # and look for "chat":{"id": ...}
  chat_id: "YOUR_CHAT_ID_HERE"
  max_alerts_per_minute: 10

detectors:
  # Add or remove detector names to enable/disable them
  enabled:
    - suid_check
    - sudoers_check
    - cron_check
    # Uncomment to enable (requires getcap):
    # - capability_check
    # Uncomment to enable (requires auditd + rules loaded):
    # - audit_parser
    # Uncomment to enable (requires searchsploit or NVD API; see version_scanner):
    # - version_scanner

  suid_check:
    scan_paths:
      - /usr/bin
      - /usr/sbin
      - /bin
      - /sbin
      - /usr/local/bin
    # Known-good item keys, paths, or prefixes ending in *.
    # Example: "/usr/bin/passwd" or "suid:/usr/bin/*"
    allowlist: []

  sudoers_check:
    watch_files:
      - /etc/sudoers
    watch_dirs:
      - /etc/sudoers.d

  cron_check:
    watch_files:
      - /etc/crontab
    watch_dirs:
      - /etc/cron.d
      - /var/spool/cron
    recursive: true

  capability_check:
    # Restrict roots for speed; use "/" to scan everything
    scan_roots:
      - /usr
      - /bin
      - /sbin
      - /usr/local
    timeout_seconds: 60

  audit_parser:
    log_path: /var/log/audit/audit.log
    poll_interval_seconds: 0.5
    # Severity and label per auditd rule key — all keys optional
    watch_keys:
      priv_esc_root:
        severity: critical
        label: "Privilege escalation to root"
      sudoers_change:
        severity: high
        label: "sudoers policy changed"
      cron_change:
        severity: high
        label: "Cron job file changed"
      suid_change:
        severity: high
        label: "SUID/SGID bit changed"
      capset_usage:
        severity: high
        label: "capset() syscall (capability grant)"
      uid_change:
        severity: medium
        label: "UID-change syscall"
      module_insertion:
        severity: critical
        label: "Kernel module insertion"

  version_scanner:
    # Add version_scanner to detectors.enabled above to activate.
    # Fingerprints dpkg/rpm packages, kernel (uname -r), and local service
    # banners; matches CVE / exploit-db *references* only (no exploit code).
    enabled: false
    engine: searchsploit          # searchsploit | nvd_api
    scan_interval_seconds: 3600   # self-throttled; poll_loop may be faster
    nvd_api_key: ""               # optional; raises NVD rate limit 5/30s → 50/30s
    cache_ttl_hours: 24
    min_severity_alert: MEDIUM
    alert_on_low_confidence: false
    # Optional: restrict lookups. Empty = default high-value set + kernel + banners.
    # Use ["*"] to query every installed package (slow).
    # watch_packages: []

dashboard:
  # Read-only web dashboard.  Add dashboard.enabled: true to activate.
  # Requires:  pip install fastapi uvicorn bcrypt
  enabled: false
  bind_host: 127.0.0.1  # Never set to 0.0.0.0 unless you understand the risk.
  port: 8420
  # HTTP Basic Auth credentials.  Both must be set; no anonymous access.
  username: admin
  # Generate with:
  #   python -c "from dashboard.app import hash_password; print(hash_password('yourpassword'))"
  password_hash: ""

logging:
  level: INFO
  file: logs/privesc_monitor.log
  max_bytes: 1048576
  backup_count: 5
  # Also echo themed channel lines to the console (stderr).
  channels_to_console: true
  # Separate themed logs — detectors vs CVE/exploit scanner vs DB integrity.
  channels:
    detectors:
      file: logs/detectors.log
      theme: DETECTOR
    exploit:
      file: logs/exploit.log
      theme: EXPLOIT
    db:
      file: logs/db.log
      theme: DB
